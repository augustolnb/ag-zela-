services:
  waha:
    image: devlikeapro/waha
    # Sem isso, um reboot da VPS (manutenção do provedor, kernel update,
    # etc.) deixa o serviço parado indefinidamente até alguém notar e
    # religar manualmente — já aconteceu uma vez em produção.
    restart: unless-stopped
    # Bind em 127.0.0.1 (não 0.0.0.0): só processos no próprio host
    # alcançam esta porta — o proxy reverso (Caddy ou nginx do host, ver
    # docs/deploy/vps.md) entra pela rede interna do compose por nome de
    # serviço; a internet nunca precisa bater direto aqui. Porta
    # configurável via WAHA_PORT para evitar colisão com outro serviço já
    # usando a porta padrão numa VPS compartilhada.
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    environment:
      # Sem isso, o WAHA gera uma API key aleatória nova a cada start do
      # container e imprime nos logs — quebrando a integração sempre que o
      # container reinicia. Valores reais ficam no .env (não versionado).
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
    volumes:
      - waha_data:/app/.sessions

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - waha
    # Mesmo racional de bind/porta configurável do serviço "waha" acima.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ZELA_WAHA_API_KEY=${WAHA_API_KEY}
      - ZELA_WAHA_BASE_URL=http://waha:3000
      - ZELA_INGESTAO_TOKEN=${ZELA_INGESTAO_TOKEN}
      - ZELA_DB_PATH=/app/data/zela.db
    volumes:
      - zela_data:/app/data
      - chroma_data:/app/chroma_db

  streamlit:
    build: .
    restart: unless-stopped
    command: ["streamlit", "run", "zela/streamlit_app/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    depends_on:
      - backend
    # Mesmo racional de bind/porta configurável do serviço "waha" acima.
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    environment:
      - STREAMLIT_SENHA=${STREAMLIT_SENHA}
      - ZELA_DB_PATH=/app/data/zela.db
    volumes:
      - zela_data:/app/data

  # Opcional: só suba este serviço se a VPS NÃO já tiver um nginx/outro
  # proxy reverso ocupando as portas 80/443 (`docker compose up -d --build`
  # sem listar "caddy" pula ele). Numa VPS compartilhada, use o nginx do
  # host + certbot apontando para as portas 127.0.0.1 acima — ver a seção
  # "VPS compartilhada com nginx já existente" em docs/deploy/vps.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - streamlit
      - waha
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  waha_data:
  zela_data:
  chroma_data:
  caddy_data:
  caddy_config:
