[project]
name = "zela"
version = "0.1.0"
description = "Zela+ — agente de IA de apoio ao idoso que mora sozinho"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "google-adk>=1.0.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zela*"]
