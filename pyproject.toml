[project]
name = "zela"
version = "0.1.0"
description = "Zela+ — agente de IA de apoio ao idoso que mora sozinho"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "google-adk>=1.0.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "uvicorn[standard]>=0.30",
    "google-genai>=2.0,<3",
    "chromadb>=1.5,<2",
    "streamlit>=1.60,<2",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
relatorio = ["markdown>=3.6,<4", "xhtml2pdf>=0.2.15,<0.3"]
deepseek = ["google-adk[extensions]>=1.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zela*"]
